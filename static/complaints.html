<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaints Dashboard - Fariyad</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 10;
        }
        
        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        
        .nav-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.4);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            transition: all 0.2s;
        }
        
        .nav-link:hover {
            background: rgba(255, 255, 255, 0.7);
        }

        .complaints-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .complaint-card {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: var(--glass-shadow);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 1rem;
        }

        .card-header h3 {
            margin: 0;
            color: var(--text-main);
            font-size: 1.2rem;
        }
        
        .card-header .badge {
            background: var(--primary);
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .card-meta {
            color: var(--text-muted);
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        
        .card-meta span {
            font-weight: 500;
        }

        .card-body {
            color: var(--text-main);
            font-size: 0.95rem;
            line-height: 1.5;
            background: rgba(255, 255, 255, 0.4);
            padding: 1rem;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="dashboard-container">
        <div class="header-actions">
            <div>
                <h1 style="margin: 0; background: linear-gradient(135deg, #1e293b, #46637e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 2.5rem;">Complaints Dashboard</h1>
                <p style="color: var(--text-muted); margin-top: 0.5rem;">View all registered civic complaints</p>
            </div>
            <a href="/" class="nav-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                Back to Portal
            </a>
        </div>
        
        <div id="loadingState" style="text-align: center; padding: 3rem; color: var(--text-muted);">
            Loading complaints...
        </div>

        <div id="complaintsGrid" class="complaints-grid hidden">
            <!-- Cards injected here -->
        </div>
    </div>

    <script>
        async function fetchComplaints() {
            try {
                const res = await fetch('/api/complaints');
                const result = await res.json();
                
                document.getElementById('loadingState').classList.add('hidden');
                const grid = document.getElementById('complaintsGrid');
                grid.classList.remove('hidden');
                
                if (result.status === 'success' && result.data.length > 0) {
                    grid.innerHTML = result.data.map(c => `
                        <div class="complaint-card">
                            <div class="card-header">
                                <h3>${c.name}</h3>
                                <span class="badge">#${c.id}</span>
                            </div>
                            <div class="card-meta">
                                <div><svg style="vertical-align: text-bottom; margin-right: 4px;" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg> ${c.email}</div>
                                <div><svg style="vertical-align: text-bottom; margin-right: 4px;" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg> ${c.street}, ${c.district}</div>
                                <div style="margin-top: 0.5rem; color: var(--primary);"><strong>Type:</strong> ${c.complaint_type || 'General'}</div>
                            </div>
                            <div class="card-body">
                                <strong>Issue Description:</strong><br>
                                ${c.complaint.replace(/\\n/g, '<br>')}
                            </div>
                        </div>
                    `).join('');
                } else {
                    grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 2rem; color: var(--text-muted); background: rgba(255,255,255,0.4); border-radius: 12px;">No complaints found.</div>';
                }
            } catch (err) {
                document.getElementById('loadingState').textContent = 'Error loading complaints.';
            }
        }
        
        fetchComplaints();
    </script>
</body>
</html>
