<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Automation Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-elements">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>

    <div class="container">
        <header>
            <h1>Fariad</h1>
            <p>Deploy prompts and images directly to your active session.</p>
        </header>

        <main>


            <div class="glass-panel input-section">
                <form id="geminiForm">
                    <div class="form-group">
                        <label for="promptInput">Your Prompt</label>
                        <textarea id="promptInput" name="prompt" placeholder="Ask anything, like 'What is it?'..." required></textarea>
                    </div>

                    <div class="form-group file-upload-wrapper">
                        <label for="imageInput" class="file-upload-label">
                            <span class="upload-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                            </span>
                            <span class="upload-text">Drag & drop or click to upload an image</span>
                        </label>
                        <input type="file" id="imageInput" name="image" accept="image/*">
                        <div id="filePreview" class="file-preview hidden">
                            <span id="fileName">No file chosen</span>
                            <button type="button" id="removeFileBtn" class="icon-btn">✕</button>
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="primary-btn">
                        <span class="btn-text">Automate Request</span>
                        <div class="spinner hidden"></div>
                    </button>
                </form>
            </div>

            <div id="responseSection" class="glass-panel response-section hidden">
                <div class="response-header">
                    <h2>Response</h2>
                    <span class="badge">Success</span>
                </div>
                <div id="responseContent" class="response-content">
                    <!-- Response injected here via JS -->
                </div>
            </div>
            
            <div id="loadingOverlay" class="loading-overlay hidden">
                <div class="loading-content">
                    <div class="large-spinner"></div>
                    <h3>Automating Gemini...</h3>
                    <p>Chrome is launching and completing the tasks. This usually takes about 30 seconds.</p>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
